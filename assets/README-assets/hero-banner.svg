<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="850" height="230">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="80%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="230" rx="12" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="848" height="228" x="1" y="1" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Accent line top -->
  <rect x="100" y="0" width="650" height="2" rx="1" fill="url(#accentLine)" opacity="0.7"/>

  <!-- Greeting -->
  <text x="425" y="65" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400" letter-spacing="4">
    <tspan>HELLO WORLD, I'M</tspan>
  </text>

  <!-- Name -->
  <text x="425" y="115" text-anchor="middle" fill="url(#textGrad)" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="700" letter-spacing="1" filter="url(#glow)">
    Bhushan Barun Mallick
  </text>

  <!-- Tagline -->
  <text x="425" y="155" text-anchor="middle" fill="url(#tagGrad)" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400" letter-spacing="2">
    Engineering Student · Developer · Builder · Problem Solver
  </text>

  <!-- Location -->
  <g transform="translate(375, 185)">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" fill="#8b949e" transform="scale(0.8)"/>
    <text x="18" y="10" fill="#8b949e" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400">Nagpur, India</text>
  </g>

  <!-- Accent line bottom -->
  <rect x="100" y="228" width="650" height="2" rx="1" fill="url(#accentLine)" opacity="0.7"/>
</svg>
