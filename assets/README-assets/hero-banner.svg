<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="840" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff"/>
      <stop offset="70%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
  </defs>

  <rect width="840" height="180" fill="url(#bg)"/>

  <!-- Top accent -->
  <rect y="0" width="840" height="2" fill="url(#accent)"/>

  <!-- Greeting -->
  <text x="420" y="58" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="3">
    HELLO, I'M
  </text>

  <!-- Name -->
  <text x="420" y="100" text-anchor="middle" fill="url(#name)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700">
    Bhushan Barun Mallick
  </text>

  <!-- Tagline -->
  <text x="420" y="135" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="1.5">
    ENGINEERING STUDENT  |  DEVELOPER  |  BUILDER  |  PROBLEM SOLVER
  </text>

  <!-- Bottom accent -->
  <rect y="178" width="840" height="2" fill="url(#accent)"/>
</svg>
