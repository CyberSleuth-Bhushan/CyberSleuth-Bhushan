name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats (lowlighter/metrics)
        uses: lowlighter/metrics@latest
        with:
          filename: stats/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CyberSleuth-Bhushan
          template: classic
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories
          base_indepth: yes
          config_display: large
          config_output: svg

      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          filename: stats/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CyberSleuth-Bhushan
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_display: large
          config_output: svg

      - name: Generate Activity Graph
        uses: lowlighter/metrics@latest
        with:
          filename: stats/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CyberSleuth-Bhushan
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          config_display: large
          config_output: svg

      - name: Generate Streak Stats
        run: |
          mkdir -p stats
          curl -sSf -o stats/streak-stats.svg \
            "https://streak-stats.demolab.com?user=CyberSleuth-Bhushan&theme=tokyonight&hide_border=true&background=0D1117&ring=58A6FF&fire=BC8CFF&currStreakLabel=58A6FF&sideLabels=C9D1D9&dates=8B949E&currStreakNum=C9D1D9&sideNums=C9D1D9" || echo "Streak stats API unavailable, skipping."

      - name: Generate Pin Cards
        run: |
          mkdir -p stats
          for REPO in AquaSentinel Honest-Weather Ultimate-Password-Generator IT-Invitations-tgp; do
            curl -sSf -o "stats/pin-${REPO}.svg" \
              "https://github-readme-stats.vercel.app/api/pin/?username=CyberSleuth-Bhushan&repo=${REPO}&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=58a6ff&icon_color=bc8cff&text_color=c9d1d9" || echo "Pin card for ${REPO} failed, skipping."
          done

      - name: Move generated metrics to stats folder
        run: |
          # lowlighter/metrics outputs files to the repo root by default
          for f in github-stats.svg top-langs.svg activity-graph.svg; do
            if [ -f "$f" ]; then
              mv "$f" "stats/$f" 2>/dev/null || true
            fi
          done
          # Verify
          echo "=== Generated stats files ==="
          ls -la stats/ 2>/dev/null || echo "No stats directory"

      - name: Push Stats to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-stats
          build_dir: stats
          commit_message: "📊 Auto-generate GitHub stats [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
